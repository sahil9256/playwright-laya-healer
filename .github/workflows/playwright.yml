name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        run: npm run test:api

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-api
          path: blob-report/
          retention-days: 1

  mock-tests:
    name: Mock Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Mock Tests
        run: npm run test:mock

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-mock
          path: blob-report/
          retention-days: 1

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run E2E Tests
        run: npm run test:e2e -- --grep-invert @visual

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-e2e
          path: blob-report/
          retention-days: 1

  visual-tests:
    name: Visual Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Visual ARIA Snapshot Tests
        run: npm run test:visual

      - name: Upload Blob Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-visual
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge Reports & Summary
    runs-on: ubuntu-latest
    needs: [api-tests, mock-tests, e2e-tests, visual-tests]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright Reports
        run: npx playwright merge-reports -c playwright.config.ts --reporter=html,json,github all-blob-reports

      - name: Upload Merged Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Generate Consolidated Job Summary
        if: always()
        run: |
          API_STATUS="${{ needs.api-tests.result == 'success' && ':white_check_mark: Passed' || (needs.api-tests.result == 'skipped' && ':white_circle: Skipped' || ':x: Failed') }}"
          MOCK_STATUS="${{ needs.mock-tests.result == 'success' && ':white_check_mark: Passed' || (needs.mock-tests.result == 'skipped' && ':white_circle: Skipped' || ':x: Failed') }}"
          E2E_STATUS="${{ needs.e2e-tests.result == 'success' && ':white_check_mark: Passed' || (needs.e2e-tests.result == 'skipped' && ':white_circle: Skipped' || ':x: Failed') }}"
          VISUAL_STATUS="${{ needs.visual-tests.result == 'success' && ':white_check_mark: Passed' || (needs.visual-tests.result == 'skipped' && ':white_circle: Skipped' || ':x: Failed') }}"

          echo "### 🎭 Playwright Consolidated Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Target / Mode | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Tests** | Node.js / REST API | $API_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mock Tests** | Desktop Chromium (Playwright Docker) | $MOCK_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **E2E Scenarios** | Desktop Chromium (Playwright Docker) | $E2E_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual Regression** | ARIA Snapshot Trees | $VISUAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Merged HTML report containing results from all suites is attached to this workflow run." >> $GITHUB_STEP_SUMMARY

      - name: Evaluate Overall Workflow Status
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ] || \
             [ "${{ needs.mock-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.visual-tests.result }}" != "success" ]; then
            echo "One or more parallel test jobs failed."
            exit 1
          fi
